<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beer Book Importer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #1C1A18; color: #F5F0E8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #FDFAF5; color: #1C1A18; border-radius: 16px; padding: 32px 28px; max-width: 520px; width: 100%; }
    h1 { color: #C8791A; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .sub { color: #8C7B6A; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px; }
    .drop-zone { border: 2px dashed #E2D9CC; border-radius: 10px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s; margin-bottom: 20px; }
    .drop-zone:hover, .drop-zone.over { border-color: #C8791A; background: #FFF8F0; }
    .drop-zone p { font-size: 14px; color: #8C7B6A; margin-top: 8px; }
    .btn { width: 100%; padding: 14px; background: #C8791A; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 0.5px; margin-top: 8px; }
    .btn:disabled { background: #E2D9CC; color: #8C7B6A; cursor: default; }
    .log { margin-top: 20px; background: #F5F0E8; border-radius: 8px; padding: 14px; font-size: 12px; max-height: 240px; overflow-y: auto; line-height: 1.8; }
    .log .ok { color: #27AE60; }
    .log .err { color: #c0392b; }
    .log .info { color: #8C7B6A; }
    .progress { height: 6px; background: #E2D9CC; border-radius: 3px; margin-top: 14px; overflow: hidden; }
    .progress-fill { height: 100%; background: #C8791A; border-radius: 3px; transition: width 0.3s; width: 0%; }
    .preview { margin-top: 16px; font-size: 12px; color: #8C7B6A; }
    .preview table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .preview th { background: #1C1A18; color: #C8791A; padding: 6px 8px; text-align: left; font-size: 11px; }
    .preview td { padding: 5px 8px; border-bottom: 1px solid #E2D9CC; font-size: 11px; color: #1C1A18; }
    .login-err { background: #FEE; border: 1px solid #fcc; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #c0392b; margin-bottom: 16px; }
    label.field { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8C7B6A; display: block; margin-bottom: 5px; margin-top: 14px; }
    input.inp { width: 100%; padding: 10px 12px; border: 1px solid #E2D9CC; border-radius: 8px; font-size: 14px; color: #1C1A18; background: #fff; outline: none; font-family: inherit; }
    input.inp:focus { border-color: #C8791A; }
  </style>
</head>
<body>
<div class="card">
  <h1>🍺 Beer Book</h1>
  <div class="sub">One-time data importer</div>

  <!-- Login section -->
  <div id="login-section">
    <label class="field">Email</label>
    <input class="inp" id="email" type="email" placeholder="your@email.com" autocomplete="email" />
    <label class="field">Password</label>
    <input class="inp" id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
    <div id="login-err" class="login-err" style="display:none;margin-top:12px;"></div>
    <button class="btn" id="login-btn" onclick="doLogin()" style="margin-top:16px;">Sign in to continue</button>
  </div>

  <!-- Import section -->
  <div id="import-section" style="display:none;">
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
      ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')"
      ondrop="handleDrop(event)">
      <div style="font-size:32px;">📂</div>
      <p>Click or drag & drop <strong>BeerBook_Cleaned.xlsx</strong> here</p>
    </div>
    <input type="file" id="file-input" accept=".xlsx" style="display:none" onchange="handleFile(this.files[0])" />

    <div id="preview" class="preview" style="display:none;"></div>
    <div id="progress" class="progress" style="display:none;"><div class="progress-fill" id="progress-fill"></div></div>
    <button class="btn" id="import-btn" onclick="doImport()" style="display:none;" disabled>Import to Firebase</button>
    <div id="log" class="log" style="display:none;"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAx01LKXa4mkS3GDPt0j7IIQ2wA4r4x33A",
    authDomain: "beerbook-ae9fa.firebaseapp.com",
    projectId: "beerbook-ae9fa",
    storageBucket: "beerbook-ae9fa.firebasestorage.app",
    messagingSenderId: "179494259041",
    appId: "1:179494259041:web:564986ede365a6d3c99d20"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let parsedRows = [];

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-err');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    err.style.display = 'none';
    try {
      await auth.signInWithEmailAndPassword(email, password);
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('import-section').style.display = 'block';
    } catch (e) {
      err.textContent = 'Incorrect email or password.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in to continue';
    }
  }

  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  function handleDrop(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.remove('over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

      // Find header row (row with "Date")
      let headerIdx = rows.findIndex(r => r.includes('Date'));
      if (headerIdx === -1) { alert('Could not find header row. Make sure you uploaded BeerBook_Cleaned.xlsx'); return; }

      const headers = rows[headerIdx];
      const dataRows = rows.slice(headerIdx + 1).filter(r => r[0] || r[1]);

      parsedRows = dataRows.map(r => ({
        date: r[headers.indexOf('Date')] ? String(r[headers.indexOf('Date')]).trim() : '',
        name: r[headers.indexOf('Beer Name')] ? String(r[headers.indexOf('Beer Name')]).trim() : '',
        quantity: parseInt(r[headers.indexOf('Quantity')]) || 1,
        location: r[headers.indexOf('Location')] ? String(r[headers.indexOf('Location')]).trim() : '',
        notes: r[headers.indexOf('Notes (Occasion)')] ? String(r[headers.indexOf('Notes (Occasion)')]).trim() : '',
        companions: r[headers.indexOf('With Whom')] ? String(r[headers.indexOf('With Whom')]).trim() : '',
        brewery: '',
        style: '',
        description: '',
        volume: 'Can',
        locationUrl: '',
        photo: null,
      })).filter(r => r.name);

      // Show preview
      const preview = document.getElementById('preview');
      let html = `<strong>${parsedRows.length} entries ready to import.</strong><br><br>`;
      html += '<table><tr><th>Date</th><th>Beer</th><th>Qty</th><th>Location</th></tr>';
      parsedRows.slice(0, 8).forEach(r => {
        html += `<tr><td>${r.date}</td><td>${r.name}</td><td>${r.quantity}</td><td>${r.location}</td></tr>`;
      });
      if (parsedRows.length > 8) html += `<tr><td colspan="4" style="color:#8C7B6A;font-style:italic;">…and ${parsedRows.length - 8} more</td></tr>`;
      html += '</table>';
      preview.innerHTML = html;
      preview.style.display = 'block';

      const btn = document.getElementById('import-btn');
      btn.style.display = 'block';
      btn.disabled = false;
      btn.textContent = `Import ${parsedRows.length} entries to Firebase`;
    };
    reader.readAsArrayBuffer(file);
  }

  async function doImport() {
    if (!parsedRows.length) return;
    const btn = document.getElementById('import-btn');
    const log = document.getElementById('log');
    const progress = document.getElementById('progress');
    const fill = document.getElementById('progress-fill');

    btn.disabled = true;
    log.style.display = 'block';
    progress.style.display = 'block';
    log.innerHTML = '<span class="info">Starting import…</span><br>';

    let success = 0, failed = 0;

    for (let i = 0; i < parsedRows.length; i++) {
      const row = parsedRows[i];
      try {
        // Create a timestamp from the date string for ordering
        const dateTs = row.date
          ? firebase.firestore.Timestamp.fromDate(new Date(row.date + 'T12:00:00'))
          : firebase.firestore.FieldValue.serverTimestamp();

        await db.collection('users').doc(auth.currentUser.uid).collection('entries').add({
          ...row,
          createdAt: dateTs,
          importedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        success++;
        log.innerHTML += `<span class="ok">✓ ${row.date} — ${row.name} (×${row.quantity})</span><br>`;
      } catch (e) {
        failed++;
        log.innerHTML += `<span class="err">✗ Failed: ${row.name} — ${e.message}</span><br>`;
      }

      fill.style.width = `${((i + 1) / parsedRows.length) * 100}%`;
      log.scrollTop = log.scrollHeight;

      // Small delay to avoid hammering Firestore
      await new Promise(r => setTimeout(r, 80));
    }

    log.innerHTML += `<br><strong class="${failed ? 'err' : 'ok'}">${success} imported successfully${failed ? `, ${failed} failed` : ''}. You can close this tab.</strong>`;
    btn.textContent = 'Import complete ✓';
  }
</script>
</body>
</html>
